<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlipClock</title><link rel="stylesheet" href="css/style.css"></head><body><button id="exitFocus" aria-label="Mostrar painel e controlos" title="Sair do modo só relógio">✕ Sair</button><div class="app"><aside class="sidebar"><h1>FlipClock</h1><p>Relógio digital com animação flip</p><div class="actions"><button id="fullscreen">Ecrã inteiro</button><button id="format">24H</button><button id="focus" aria-pressed="false">Só relógio</button></div><h2>Temas</h2><div id="themes" class="themes"></div></aside><main><div class="clock" id="clock"><div class="unit"><div id="hours" class="digits"></div><small>HORAS</small></div><span class="colon">:</span><div class="unit"><div id="minutes" class="digits"></div><small>MINUTOS</small></div><span class="colon">:</span><div class="unit"><div id="seconds" class="digits"></div><small>SEGUNDOS</small></div></div><p id="date"></p></main></div><script src="js/script.js"></script></body></html>
